<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raporty — ściąga huntera (WoW: Forever)</title>
<style>
  :root{ --bg:#14161c; --card:#1d212b; --line:#2c3242; --txt:#e8e6df; --gold:#e5b95c; --dim:#9aa0ac; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 "Segoe UI",system-ui,sans-serif;padding:24px}
  .wrap{max-width:860px;margin:0 auto}
  h1{color:var(--gold);font-size:26px;margin:0 0 4px}
  .sub{color:var(--dim);margin:0 0 18px;font-size:14px}
  .sub a{color:var(--gold)}
  .status{font-size:13px;color:var(--dim);margin-bottom:18px}
  .entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 14px}
  .entry h2{color:var(--gold);font-size:17px;margin:0 0 8px}
  .entry ul{margin:8px 0 0;padding-left:20px}
  .entry li{margin:4px 0}
  .entry p{margin:8px 0 0}
  .entry a{color:var(--gold)}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--dim)}
  .foot{color:var(--dim);font-size:13px;margin-top:22px}
  #err{display:none;background:#39232a;border:1px solid #5c3540;border-radius:12px;padding:12px 16px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 Raporty huntera</h1>
  <p class="sub">Tu lądują wpisy, gdy robot 24/7 doda coś do <a href="./">ściągi</a>. Strona odświeża się sama co 5 minut.</p>
  <div class="status" id="status">Wczytywanie…</div>
  <div id="err">⚠️ Nie udało się pobrać raportów. Spróbuj odświeżyć stronę za chwilę.</div>
  <div id="entries"></div>
  <p class="foot">Wpis = aktualizacja ściągi z ostatniego przebiegu robota. Spokojne dni = brak wpisów (i bardzo dobrze 🙂).</p>
</div>
<script>
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
}
function render(md){
  const lines=md.split(/\r?\n/);
  const out=[]; let cur=null; let inList=false;
  const closeEntry=()=>{ if(cur){ if(inList){cur.push("</ul>");inList=false;} out.push('<div class="entry">'+cur.join("")+'</div>'); cur=null; } };
  for(const raw of lines){
    const line=raw.trim();
    if(!line){ continue; }
    if(line.startsWith("<!--")){ continue; }
    if(line.startsWith("## ")){ closeEntry(); cur=["<h2>"+fmt(line.slice(3))+"</h2>"]; continue; }
    if(line.startsWith("# ")){ continue; }
    if(line.startsWith("- ")){ if(!cur){cur=[];} if(!inList){cur.push("<ul>");inList=true;} cur.push("<li>"+fmt(line.slice(2))+"</li>"); continue; }
    if(cur){ if(inList){cur.push("</ul>");inList=false;} cur.push("<p>"+fmt(line)+"</p>"); }
  }
  closeEntry();
  return out.join("");
}
async function load(){
  const st=document.getElementById("status"); const err=document.getElementById("err");
  try{
    const r=await fetch("./RAPORTY.md?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const md=await r.text();
    const cnt=(md.match(/^## /gm)||[]).length;
    document.getElementById("entries").innerHTML= cnt? render(md) : '<div class="empty">Na razie cisza — brak wpisów. To dobra wiadomość: nic się nie zmieniło. 😉</div>';
    st.textContent="Sprawdzono: "+new Date().toLocaleString("pl-PL");
    err.style.display="none";
  }catch(e){
    err.style.display="block"; st.textContent="Błąd: "+e.message;
  }
}
load(); setInterval(load,300000);
</script>
</body>
</html>
